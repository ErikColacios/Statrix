server {
    listen 80;
    server_name statrix.app www.statrix.app;

    location / {
        proxy_pass http://web:3000;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name statrix.app www.statrix.app;

    ssl_certificate /etc/letsencrypt/live/statrix.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/statrix.app/privkey.pem;

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /chat/ {
        proxy_pass http://chat:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}