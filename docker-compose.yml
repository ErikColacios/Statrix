services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    expose:
      - "3000"

  chat:
    build:
      context: .
      dockerfile: Dockerfile.chat
    expose:
      - "4000"

  nginx:
    image: nginx:alpine
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - chat